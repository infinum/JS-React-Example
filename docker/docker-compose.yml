name: infinum-react-example

services:
  frontend:
    container_name: infinum-react-example-frontend
    image: infinum-react-example-frontend
    restart: unless-stopped
    build:
      context: ..
      dockerfile: ./apps/frontend/Dockerfile
      target: production
    ports:
      - '3000:3000'
    environment:
      - HOSTNAME=0.0.0.0
      # Secrets forwarded from the host process. These have no value here on purpose:
      # compose passes through whatever is in the parent environment (populated locally
      # by mise, or by the pipeline's secret provider in CI). Never inline real values.
      - NEXTAUTH_SECRET
      - TEST_SECRET
    env_file:
      - ../apps/frontend/.env
      - ../apps/frontend/.env.compose
      - ../apps/frontend/.env.compose.local
  storybook:
    container_name: infinum-react-example-storybook
    image: infinum-react-example-storybook
    restart: unless-stopped
    build:
      context: ..
      dockerfile: ./apps/storybook/Dockerfile
      target: production
    ports:
      - '6006:80'
