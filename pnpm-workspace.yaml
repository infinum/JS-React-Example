# Advisories with no published patch cannot be acted on, so they are dropped from the
# report. NOTE: this is a blanket rule — a future unfixable high/critical would also be
# hidden. The known cases are listed explicitly under auditConfig.ignoreGhsas below so
# they stay reviewable; re-check that list on every dependency update.
ignoreUnfixable: true

auditConfig:
  ignoreGhsas:
    # elliptic (GHSA-848j-6mx2-7j84): no patch published — 6.6.1 is still the latest
    # release and the advisory requires >=6.6.2. Low severity and dev-only: it reaches
    # us through Storybook's webpack node polyfills, never through shipped app code.
    # Path: @storybook/nextjs>node-polyfill-webpack-plugin>crypto-browserify>browserify-sign>elliptic
    # Drop this once 6.6.2 lands.
    - GHSA-848j-6mx2-7j84

engineStrict: true

minimumReleaseAge: 10080

# Security fixes published more recently than minimumReleaseAge allows.
minimumReleaseAgeExclude:
  - brace-expansion@1.1.18 || 2.1.4

peerDependencyRules:
  allowedVersions:
    # eslint-plugin-react 7.37.5 is the newest stable release and still caps its peer
    # at eslint ^9.7, but it runs fine on eslint 10. Remove once 7.38+ ships.
    eslint-plugin-react>eslint: '10'

overrides:
  # GHSA-frvp-7c67-39w9: path traversal in serve-static on Windows
  '@hono/node-server@<2.0.5': '>=2.0.5'
  # GHSA-mh99-v99m-4gvg: DoS via unbounded expansion length
  brace-expansion@<1.1.17: 1.1.18
  brace-expansion@>=2.0.0 <2.1.3: 2.1.4
  # GHSA-v2hh-gcrm-f6hx, GHSA-4c8g-83qw-93j6: host confusion via backslash authority / failed IDN canonicalization
  fast-uri@>=3.0.0 <3.1.4: '>=3.1.4 <4'
  # GHSA-qx2v-qp2m-jg93, GHSA-6g55-p6wh-862q, GHSA-r28c-9q8g-f849: sourceMappingURL arbitrary file read
  postcss@<8.5.18: '>=8.5.18'
  # GHSA-f88m-g3jw-g9cj: inherited libvips vulnerabilities
  sharp@<0.35.0: '>=0.35.0'

strictDepBuilds: true

strictPeerDependencies: true
