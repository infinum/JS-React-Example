# Report every advisory. `ignoreUnfixable: true` hid 118 advisories here, most of them with a
# published patch (including critical Next.js RCEs), so `pnpm audit` passed while it shouldn't.
# An advisory that really can't be fixed goes under auditConfig.ignoreGhsas, with a comment saying
# why and when to re-check it, so every exception stays reviewable.
ignoreUnfixable: false

auditConfig:
  ignoreGhsas:
    # deepmerge 4.3.1 (low): prototype pollution. No patched release exists (4.3.1 is the latest).
    # Dev-only, through the shadcn CLI, which never merges untrusted input. Re-check on shadcn updates.
    - GHSA-gcqx-w48m-w2h4

engineStrict: true

minimumReleaseAge: 10080

peerDependencyRules:
  allowedVersions:
    # eslint-plugin-react 7.37.5 is the newest stable release and still caps its peer
    # at eslint ^9.7, but it runs fine on eslint 10. Remove once 7.38+ ships.
    eslint-plugin-react>eslint: '10'
    # eslint-plugin-jsx-a11y 6.10.2 is the newest release and still caps its peer at eslint ^9,
    # but it runs fine on eslint 10. Remove once a release allows eslint 10.
    eslint-plugin-jsx-a11y>eslint: '10'
    # tsconfck 3.1.6 is the newest release and still caps its peer at typescript ^5. It comes in
    # through @storybook/nextjs-vite > vite-plugin-storybook-nextjs > vite-tsconfig-paths and only
    # needs TypeScript for parseNative, which vite-tsconfig-paths doesn't call.
    # Remove once tsconfck allows typescript 6.
    tsconfck>typescript: '6'

